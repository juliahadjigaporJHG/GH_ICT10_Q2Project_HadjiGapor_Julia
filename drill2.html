
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <title>Drill 2</title>

    <style>
        nav.navbar {
            background-color: #55a7f4 !important;
            padding-left: 30px;
            padding-right: 30px;
            width: 100%;
            align-self: stretch;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;
            color: #102344;
            background: #edf4fc;
            background-image:
                linear-gradient(rgba(28, 91, 173, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(28, 91, 173, 0.045) 1px, transparent 1px);
            background-size: 35px 35px;
        }

        .club-card {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 480px;
            padding: 42px 36px;
            background: #ffffff;
            border: 1px solid #d9e5f5;
            border-radius: 18px;
            box-shadow: 0 18px 55px rgba(15, 45, 85, 0.12);
        }

        .club-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 7px;
            background: linear-gradient(90deg, #071a35, #1268d8, #7db8ff);
        }

        .club-card::after {
            content: "BL";
            position: absolute;
            top: 15px;
            right: -8px;
            font-size: 100px;
            font-weight: 900;
            font-style: italic;
            color: rgba(24, 99, 204, 0.055);
            pointer-events: none;
        }

        .club-header {
            position: relative;
            z-index: 1;
            margin-bottom: 32px;
        }

        .club-tag {
            display: inline-block;
            margin-bottom: 17px;
            padding: 7px 12px;
            color: #1766c5;
            background: #eaf3ff;
            border-left: 3px solid #1766c5;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        h1 {
            margin-bottom: 9px;
            color: #102344;
            font-size: clamp(29px, 7vw, 39px);
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1.5px;
        }

        .subtitle {
            color: #6d7d94;
            font-size: 13px;
            line-height: 1.7;
        }

        .divider {
            width: 48px;
            height: 4px;
            margin-top: 20px;
            background: #1766c5;
            border-radius: 5px;
        }

        .form-heading {
            margin-bottom: 17px;
            color: #102344;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #344760;
            font-size: 12px;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            color: #102344;
            background: #f7faff;
            border: 1px solid #dbe5f1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.25s ease;
        }

        input[type="text"]::placeholder {
            color: #9ba9bc;
        }

        input[type="text"]:focus {
            background: #ffffff;
            border-color: #1766c5;
            box-shadow: 0 0 0 3px rgba(23, 102, 197, 0.1);
        }

        input[type="button"] {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            color: #ffffff;
            background: #155fc0;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        input[type="button"]:hover {
            background: #0b2345;
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(21, 95, 192, 0.2);
        }

        input[type="button"]:active {
            transform: translateY(0);
        }

        #result {
            position: relative;
            z-index: 1;
            margin-top: 22px;
            color: #155fc0;
            font-size: 14px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .club-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding-top: 17px;
            border-top: 1px solid #e7edf5;
            color: #8795a8;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.2px;
        }

        .footer-mark {
            color: #1766c5;
        }

        @media (max-width: 420px) {
            .club-card {
                padding: 35px 23px;
            }

            .club-footer {
                font-size: 8px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
    <div class="container-fluid">
        <div class="collapse navbar-collapse show" id="mynavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Meet the creator</a>
                </li>
                <li class="nav-item">
                    <a href="skillstest2.html" class="nav-link">Element Checker</a>
                </li>
                <li class="nav-item">
                    <a href="seatwork2.html" class="nav-link">Verification System</a>
                </li>
                <li class="nav-item">
                    <a href="drill2.html" class="nav-link">Club Member Management</a>
                </li>
            </ul>
        </div>
    </div>
    </nav>

    <main class="club-card">

        <header class="club-header">
            <span class="club-tag">BLUE LOCK // FOOTBALL CLUB</span>
            <h1>Drill 2</h1>
            <p class="subtitle">
                Every player has a goal.<br>
                Every name starts a new journey.
            </p>
            <div class="divider"></div>
        </header>

        <form onsubmit="return false;">
            <p class="form-heading">PLAYER REGISTRATION</p>

            <div class="input-group">
                <label for="first_name">FIRST NAME</label>
                <input
                    type="text"
                    id="first_name"
                    placeholder="Enter first name"
                >
            </div>

            <div class="input-group">
                <label for="last_name">LAST NAME</label>
                <input
                    type="text"
                    id="last_name"
                    placeholder="Enter last name"
                >
            </div>

            <input
                type="button"
                py-click="new_members"
                value="REGISTER PLAYER  →"
            >
        </form>

        <div id="result"></div>

        <footer class="club-footer">
            <span>BLUE LOCK PROJECT</span>
            <span class="footer-mark">STRIVE FOR THE GOAL.</span>
        </footer>

    </main>

    <py-script src="drill2.py"></py-script>
</body>
</html>
